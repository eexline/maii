<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eaed" />
  <title>AWG Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8eaed;
      --panel: #f7f8fa;
      --ink: #14171c;
      --muted: #5c6570;
      --line: #d5d9e0;
      --line-strong: #b8bfc9;
      --accent: #1f4b7a;
      --accent-soft: #d9e4f0;
      --danger: #9b1c1c;
      --lead-bg: #ffffff;
      --bot-bg: #eef1f5;
      --op-bg: #e4edf6;
      --font: "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --aside-w: min(360px, 38vw);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        linear-gradient(180deg, #dfe3e8 0%, var(--bg) 28%, #e4e7eb 100%);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* ——— login ——— */
    #login {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: max(20px, var(--safe-t)) 20px max(20px, var(--safe-b));
    }
    .login-box {
      width: min(360px, 100%);
    }
    .login-box .brand {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .login-box h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .login-box .hint {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .field { display: grid; gap: 8px; }
    .field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }
    input[type="password"],
    input[type="search"],
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: var(--accent);
      color: #f5f8fc;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }
    .btn.block { width: 100%; }
    .err {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 10px;
    }

    /* ——— app shell ——— */
    #app {
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-columns: var(--aside-w) 1fr;
      min-height: 0;
    }
    aside, main {
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }
    aside {
      border-right: 1px solid var(--line);
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      padding-top: calc(12px + var(--safe-t));
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .bar h2 {
      margin: 0;
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .bar .count {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }
    .search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .list {
      overflow: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: grid;
      gap: 4px;
    }
    .item:hover { background: #eef0f3; }
    .item.active { background: var(--accent-soft); }
    .item .row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .item .name {
      font-weight: 600;
      font-size: 0.95rem;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item .status {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .item .status.is-taken { color: var(--accent); }
    .item .status.is-queued { color: #8a4b12; }
    .item .meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .item .preview {
      font-size: 0.88rem;
      color: #2a3038;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    main { position: relative; }
    .empty-state {
      margin: auto;
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
    }
    #chatPane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .chat-head {
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      padding-top: calc(10px + var(--safe-t));
      flex-shrink: 0;
      display: grid;
      gap: 8px;
      background: var(--panel);
    }
    .chat-head .top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-head .title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chat-actions .btn {
      padding: 8px 12px;
      min-height: 40px;
      font-size: 0.88rem;
    }
    .chat-sub {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
      word-break: break-word;
    }
    .back-btn { display: none; }

    .msgs {
      flex: 1;
      overflow: auto;
      padding: 16px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #eef0f3;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: min(560px, 88%);
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 0.94rem;
      border: 1px solid transparent;
    }
    .bubble.user {
      align-self: flex-start;
      background: var(--lead-bg);
      border-color: var(--line);
    }
    .bubble.assistant {
      align-self: flex-end;
      background: var(--bot-bg);
      border-color: var(--line);
    }
    .bubble.operator {
      align-self: flex-end;
      background: var(--op-bg);
      border-color: #c5d4e6;
    }
    .bubble .who {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      padding-bottom: calc(10px + var(--safe-b));
      background: var(--panel);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      flex-shrink: 0;
    }
    .composer textarea {
      min-height: 52px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
    }
    .composer .btn { min-width: 96px; }

    /* ——— mobile ——— */
    @media (max-width: 820px) {
      :root { --aside-w: 100%; }
      #app {
        grid-template-columns: 1fr;
      }
      #app main { display: none; }
      #app.chat-open aside { display: none; }
      #app.chat-open main { display: flex; }
      .back-btn { display: inline-flex; align-items: center; }
      .chat-head { padding-top: calc(8px + var(--safe-t)); }
      .bar { padding-top: calc(10px + var(--safe-t)); }
      .bubble { max-width: 92%; font-size: 0.92rem; }
      .composer {
        grid-template-columns: 1fr;
      }
      .composer .btn { width: 100%; }
      .chat-actions { width: 100%; }
      .chat-actions .btn { flex: 1; }
    }

    @media (min-width: 821px) {
      .bar { padding-top: 12px; }
      .chat-head { padding-top: 12px; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-box">
      <p class="brand">AWG Support</p>
      <h1>Operator</h1>
      <p class="hint">Очередь лидов и ответы в Telegram.</p>
      <form id="loginForm">
        <input type="text" name="username" autocomplete="username" value="operator" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div style="margin-top:14px">
          <button class="btn block" type="submit">Войти</button>
        </div>
        <div class="err" id="loginErr"></div>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside>
      <div class="bar">
        <h2><span id="listTitle">Чаты</span> <span class="count" id="qCount"></span></h2>
        <button type="button" class="btn ghost" id="logoutBtn">Выйти</button>
      </div>
      <div class="tabs" id="tabs" style="display:flex;gap:0;border-bottom:1px solid var(--line);flex-shrink:0">
        <button type="button" class="tab active" data-tab="inbox" style="flex:1;border:0;background:transparent;padding:10px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid var(--accent);color:var(--ink)">Все</button>
        <button type="button" class="tab" data-tab="queue" style="flex:1;border:0;background:transparent;padding:10px;font:inherit;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)">Очередь</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="searchQ" placeholder="Поиск: @user, id, имя" enterkeyhint="search" />
      </div>
      <div class="list" id="queueList"></div>
    </aside>

    <main>
      <div id="emptyState" class="empty-state">Выбери чат слева</div>
      <div id="chatPane" class="hidden">
        <div class="chat-head">
          <div class="top-row">
            <button type="button" class="btn ghost back-btn" id="backBtn" aria-label="Назад">←</button>
            <div class="title" id="chatTitle">—</div>
          </div>
          <div class="chat-actions">
            <button type="button" class="btn ghost" id="takeBtn">Взять</button>
            <button type="button" class="btn ghost" id="releaseBtn">Вернуть боту</button>
          </div>
          <div class="chat-sub" id="chatSub"></div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <textarea id="replyText" placeholder="Ответ лиду" rows="2"></textarea>
          <button type="button" class="btn" id="sendBtn">Отправить</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const state = {
      token: localStorage.getItem("op_token") || "",
      leads: [],
      activeId: null,
      lastMsgId: 0,
      pollTimer: null,
      searchTimer: null,
      tab: localStorage.getItem("op_tab") || "inbox",
    };

    const $ = (id) => document.getElementById(id);

    function isMobile() {
      return window.matchMedia("(max-width: 820px)").matches;
    }

    function setChatOpen(open) {
      $("app").classList.toggle("chat-open", !!open);
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (state.token) headers.Authorization = "Bearer " + state.token;
      const res = await fetch(path, { ...opts, headers });
      if (res.status === 401) {
        logout(true);
        throw new Error("Сессия истекла");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        const msg = typeof detail === "string" ? detail : (data.message || ("HTTP " + res.status));
        throw new Error(msg);
      }
      return data;
    }

    function showApp(ok) {
      $("login").classList.toggle("hidden", ok);
      $("app").classList.toggle("hidden", !ok);
      if (!ok) setChatOpen(false);
    }

    function logout(silent) {
      const t = state.token;
      state.token = "";
      localStorage.removeItem("op_token");
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = null;
      showApp(false);
      if (!silent && t) api("/api/logout", { method: "POST" }).catch(() => {});
    }

    function reasonLabel(r) {
      return ({
        ask_human: "просил оператора",
        tech_stuck: "техтупик",
        complaint: "жалоба",
        false_claim: "фейк готово",
        stuck_loop: "зациклился",
        manual: "вручную",
      })[r] || (r || "—");
    }

    function setTab(tab) {
      state.tab = tab === "queue" ? "queue" : "inbox";
      localStorage.setItem("op_tab", state.tab);
      document.querySelectorAll("#tabs .tab").forEach((btn) => {
        const on = btn.dataset.tab === state.tab;
        btn.classList.toggle("active", on);
        btn.style.fontWeight = on ? "600" : "500";
        btn.style.color = on ? "var(--ink)" : "var(--muted)";
        btn.style.borderBottomColor = on ? "var(--accent)" : "transparent";
      });
      $("listTitle").textContent = state.tab === "queue" ? "Очередь" : "Чаты";
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function startPolling() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        try {
          await refreshQueue();
          await loadMessages(false);
        } catch (_) {}
      }, 2500);
    }

    function renderQueue(items) {
      state.leads = items || [];
      $("qCount").textContent = items.length ? String(items.length) : "";
      const box = $("queueList");
      if (!items.length) {
        box.innerHTML = '<div class="list-empty">' + (state.tab === "queue" ? "Очередь пуста" : "Пока нет диалогов") + "</div>";
        return;
      }
      box.innerHTML = items.map((l) => {
        const name = (l.first_name || "Лид") + (l.username ? " @" + l.username : "");
        const st = l.human_status === "taken" ? "taken" : "queued";
        const active = l.id === state.activeId ? " active" : "";
        const inHandoff = l.human_status === "queued" || l.human_status === "taken";
        const statusTxt = inHandoff ? st : (l.stage_label || "bot");
        const statusCls = inHandoff ? ("is-" + st) : "";
        const metaBits = [
          l.stage_label || null,
          inHandoff ? reasonLabel(l.handoff_reason) : null,
        ].filter(Boolean);
        return `<button type="button" class="item${active}" data-id="${l.id}">
          <div class="row">
            <span class="name">${escapeHtml(name)}</span>
            <span class="status ${statusCls}">${escapeHtml(statusTxt)}</span>
          </div>
          <div class="meta">${escapeHtml(metaBits.join(" · ") || "—")}</div>
          <div class="preview">${escapeHtml(l.last_user_text || "")}</div>
        </button>`;
      }).join("");
      box.querySelectorAll(".item").forEach((el) => {
        el.onclick = () => openLead(Number(el.dataset.id));
      });
    }

    async function refreshQueue() {
      const path = state.tab === "queue" ? "/api/queue" : "/api/inbox";
      const data = await api(path);
      renderQueue(data.items || []);
    }

    function closeChat() {
      state.activeId = null;
      state.lastMsgId = 0;
      $("chatPane").classList.add("hidden");
      $("emptyState").classList.remove("hidden");
      $("msgs").innerHTML = "";
      setChatOpen(false);
      renderQueue(state.leads);
    }

    async function openLead(id) {
      state.activeId = id;
      state.lastMsgId = 0;
      $("emptyState").classList.add("hidden");
      $("chatPane").classList.remove("hidden");
      $("msgs").innerHTML = "";
      setChatOpen(true);
      renderQueue(state.leads);

      const lead = await api("/api/leads/" + id);
      const name = (lead.first_name || "Лид") + (lead.username ? " @" + lead.username : "");
      $("chatTitle").textContent = name;
      const bits = [
        "tg " + lead.telegram_id,
        lead.stage_label || null,
        lead.human_status,
        lead.bot_muted ? "mute" : null,
        reasonLabel(lead.handoff_reason),
      ].filter(Boolean);
      $("chatSub").textContent = bits.join(" · ");
      await loadMessages(true);
    }

    async function loadMessages(scrollEnd) {
      if (!state.activeId) return;
      const data = await api(`/api/leads/${state.activeId}/messages?after_id=${state.lastMsgId}`);
      const box = $("msgs");
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
      (data.messages || []).forEach((m) => {
        state.lastMsgId = Math.max(state.lastMsgId, m.id);
        const src = (m.meta && m.meta.source) || "";
        const cls = m.role === "user" ? "user" : (src === "operator" ? "operator" : "assistant");
        const who = m.role === "user" ? "лид" : (src === "operator" ? "оператор" : (src === "handoff" ? "система" : "бот"));
        const el = document.createElement("div");
        el.className = "bubble " + cls;
        el.innerHTML = `<div class="who">${who}</div>${escapeHtml(m.content)}`;
        box.appendChild(el);
      });
      if (scrollEnd || nearBottom) box.scrollTop = box.scrollHeight;
    }

    async function sendReply() {
      const text = $("replyText").value.trim();
      if (!text || !state.activeId) return;
      $("sendBtn").disabled = true;
      try {
        await api(`/api/leads/${state.activeId}/reply`, {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        $("replyText").value = "";
        autosize();
        await loadMessages(true);
        await refreshQueue();
      } catch (e) {
        alert(e.message || e);
      } finally {
        $("sendBtn").disabled = false;
      }
    }

    function autosize() {
      const ta = $("replyText");
      ta.style.height = "auto";
      ta.style.height = Math.min(160, Math.max(52, ta.scrollHeight)) + "px";
    }

    $("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      $("loginErr").textContent = "";
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ password: $("password").value }),
        });
        state.token = data.token;
        localStorage.setItem("op_token", state.token);
        showApp(true);
        setTab(state.tab);
        await refreshQueue();
        startPolling();
      } catch (err) {
        $("loginErr").textContent = err.message || "Ошибка входа";
      }
    };

    document.querySelectorAll("#tabs .tab").forEach((btn) => {
      btn.onclick = async () => {
        setTab(btn.dataset.tab);
        $("searchQ").value = "";
        await refreshQueue();
      };
    });

    $("logoutBtn").onclick = () => logout(false);
    $("backBtn").onclick = () => closeChat();
    $("sendBtn").onclick = sendReply;
    $("replyText").addEventListener("input", autosize);
    $("replyText").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !isMobile()) {
        e.preventDefault();
        sendReply();
      }
    });
    $("takeBtn").onclick = async () => {
      if (!state.activeId) return;
      await api(`/api/leads/${state.activeId}/take`, { method: "POST" });
      await openLead(state.activeId);
      await refreshQueue();
    };
    $("releaseBtn").onclick = async () => {
      if (!state.activeId) return;
      await api(`/api/leads/${state.activeId}/release`, { method: "POST" });
      closeChat();
      await refreshQueue();
    };
    $("searchQ").oninput = () => {
      clearTimeout(state.searchTimer);
      state.searchTimer = setTimeout(async () => {
        const q = $("searchQ").value.trim();
        if (q.length < 2) {
          await refreshQueue();
          return;
        }
        const data = await api("/api/search?q=" + encodeURIComponent(q));
        renderQueue(data.items || []);
      }, 250);
    };

    window.addEventListener("resize", () => {
      if (!isMobile()) setChatOpen(!!state.activeId);
    });

    async function enterApp() {
      showApp(true);
      setTab(state.tab);
      await refreshQueue();
      startPolling();
    }

    async function tryAuthFromQuery() {
      const params = new URLSearchParams(window.location.search || "");
      const auth = params.get("auth");
      if (!auth) return false;
      try {
        const data = await api("/api/login/telegram", {
          method: "POST",
          body: JSON.stringify({ auth }),
        });
        state.token = data.token;
        localStorage.setItem("op_token", state.token);
        // убрать auth из URL, чтобы не светить токен
        const clean = window.location.pathname + (window.location.hash || "");
        window.history.replaceState({}, "", clean);
        await enterApp();
        return true;
      } catch (err) {
        $("loginErr").textContent = err.message || "Ссылка недействительна";
        return false;
      }
    }

    (async () => {
      if (await tryAuthFromQuery()) return;
      if (!state.token) return;
      try {
        await api(state.tab === "queue" ? "/api/queue" : "/api/inbox");
        await enterApp();
      } catch (_) {
        logout(true);
      }
    })();
  </script>
</body>
</html>
