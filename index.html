<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1c19" />
  <title>AWG Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #161816;
      --muted: #5e6560;
      --paper: #e4e2dc;
      --panel: #f3f1ec;
      --panel-2: #faf9f6;
      --line: #d4d1c9;
      --line-strong: #b8b4aa;
      --accent: #0e5c4a;
      --accent-ink: #f2f7f4;
      --accent-soft: #d7ebe4;
      --warn: #8a4f12;
      --danger: #8f1d1d;
      --lead-bg: #ffffff;
      --bot-bg: #eceae4;
      --op-bg: #d9ebe5;
      --font: "Manrope", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --aside-w: min(340px, 36vw);
      --radius: 6px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(90deg, rgba(22, 24, 22, 0.03) 1px, transparent 1px),
        linear-gradient(rgba(22, 24, 22, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    #login {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: max(24px, var(--safe-t)) 20px max(24px, var(--safe-b));
    }
    .login-box {
      width: min(380px, 100%);
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 28px 26px 24px;
      box-shadow: 0 18px 40px rgba(22, 24, 22, 0.08);
    }
    .login-box .brand {
      margin: 0 0 10px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .login-box h1 {
      margin: 0 0 8px;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    .login-box .hint {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .field { display: grid; gap: 8px; }
    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    input[type="password"],
    input[type="search"],
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    .btn {
      border: 0;
      border-radius: var(--radius);
      padding: 11px 15px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 650;
      cursor: pointer;
      min-height: 44px;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }
    .btn.block { width: 100%; }
    .err {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 10px;
    }

    #app {
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      display: grid;
      grid-template-columns: var(--aside-w) 1fr;
      min-height: 0;
      overflow: hidden;
      border-top: 3px solid var(--accent);
    }
    aside, main {
      height: 100%;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
    }
    aside { border-right: 1px solid var(--line-strong); }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      padding-top: calc(14px + var(--safe-t));
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      background: var(--panel-2);
    }
    .bar h2 {
      margin: 0;
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .bar .count {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      background: var(--panel-2);
    }
    .tabs .tab {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 11px 10px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tabs .tab.active {
      font-weight: 700;
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    .search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      background: var(--panel);
    }
    .list {
      overflow: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
      background: var(--panel);
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 3px 10px;
      align-items: start;
    }
    .item:hover { background: rgba(255,255,255,0.55); }
    .item.active {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .item .avatar,
    .head-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #f4faf8;
      letter-spacing: -0.02em;
      background: #2a4a42;
    }
    .item .avatar { grid-row: 1 / span 3; }
    .item .avatar img,
    .head-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .item .row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .item .name {
      font-weight: 700;
      font-size: 0.94rem;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }
    .item .status {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .item .status.is-taken { color: var(--accent); }
    .item .status.is-queued { color: var(--warn); }
    .item .meta {
      font-size: 0.76rem;
      color: var(--muted);
    }
    .item .preview {
      font-size: 0.86rem;
      color: #2c322e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-empty {
      padding: 40px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    main {
      position: relative;
      background: var(--panel-2);
      height: 100%;
      overflow: hidden;
    }
    .empty-state {
      margin: auto;
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
      max-width: 280px;
      line-height: 1.5;
    }
    .empty-state strong {
      display: block;
      color: var(--ink);
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    #chatPane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .chat-head {
      border-bottom: 1px solid var(--line-strong);
      padding: 12px 16px;
      padding-top: calc(12px + var(--safe-t));
      flex: 0 0 auto;
      display: grid;
      gap: 10px;
      background: var(--panel-2);
    }
    .chat-head .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-head .title {
      flex: 1;
      min-width: 0;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chat-actions .btn {
      padding: 8px 12px;
      min-height: 40px;
      font-size: 0.88rem;
    }
    .chat-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .chat-sub .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      line-height: 1.2;
      max-width: 100%;
    }
    .chat-sub .chip .k {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.64rem;
    }
    .chat-sub .chip.stage {
      background: var(--accent-soft);
      border-color: #b7d4c8;
      color: var(--accent);
    }
    .chat-sub .chip.status-bot { color: var(--muted); }
    .chat-sub .chip.status-taken {
      background: var(--accent-soft);
      border-color: #b7d4c8;
      color: var(--accent);
    }
    .chat-sub .chip.status-queued {
      background: #f3e6d4;
      border-color: #e0c49a;
      color: var(--warn);
    }
    .chat-sub .chip.mute {
      background: #f0e4e4;
      border-color: #dbc0c0;
      color: var(--danger);
    }
    .back-btn { display: none; }

    .msgs {
      flex: 1 1 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        linear-gradient(180deg, #dfddd6 0%, #e8e6e0 48%, #e3e1db 100%);
      -webkit-overflow-scrolling: touch;
    }
    .day-sep {
      align-self: center;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
      margin: 4px 0;
    }
    .bubble {
      max-width: min(560px, 86%);
      flex: 0 0 auto;
      padding: 0;
      border-radius: var(--radius);
      word-break: break-word;
      line-height: 1.45;
      font-size: 0.93rem;
      border: 1px solid var(--line);
      overflow: hidden;
      background: var(--lead-bg);
    }
    .bubble.user { align-self: flex-start; }
    .bubble.user.cmd .bubble-body,
    .bubble.user.btn-tap .bubble-body {
      font-family: var(--mono);
      font-size: 0.86rem;
    }
    .bubble.user.cmd { border-color: #c4b89a; background: #f7f1e4; }
    .bubble.user.btn-tap { border-color: #b7c4d4; background: #eef2f7; }
    .bubble.assistant {
      align-self: flex-end;
      background: var(--bot-bg);
    }
    .bubble.operator {
      align-self: flex-end;
      background: var(--op-bg);
      border-color: #b5d2c8;
    }
    .bubble .who {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 11px 0;
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .bubble .when {
      color: #8a9088;
      letter-spacing: 0;
      text-transform: none;
      font-size: 0.66rem;
    }
    .bubble-body {
      padding: 6px 11px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-body b, .bubble-body strong { font-weight: 700; }
    .bubble-body i, .bubble-body em { font-style: italic; }
    .bubble-body u, .bubble-body ins { text-decoration: underline; }
    .bubble-body s, .bubble-body strike, .bubble-body del { text-decoration: line-through; }
    .bubble-body code, .bubble-body pre {
      font-family: var(--mono);
      font-size: 0.88em;
      background: rgba(22, 24, 22, 0.06);
      border-radius: 3px;
      padding: 0.05em 0.35em;
    }
    .bubble-body pre {
      display: block;
      padding: 8px 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      margin: 4px 0 0;
    }
    .bubble-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .composer {
      border-top: 1px solid var(--line-strong);
      padding: 10px 14px 12px;
      padding-bottom: calc(12px + var(--safe-b));
      background: var(--panel-2);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      align-items: end;
      flex: 0 0 auto;
    }
    .fmt-bar {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .fmt-bar button {
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 4px;
      min-width: 34px;
      height: 30px;
      padding: 0 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--ink);
    }
    .fmt-bar button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .fmt-bar button:active { transform: translateY(1px); }
    .composer textarea {
      min-height: 52px;
      max-height: 160px;
      resize: none;
      line-height: 1.4;
      background: #fff;
    }
    .composer .btn { min-width: 108px; }

    @media (max-width: 820px) {
      :root { --aside-w: 100%; }
      #app { grid-template-columns: 1fr; }
      #app main { display: none; }
      #app.chat-open aside { display: none; }
      #app.chat-open main { display: flex; }
      .back-btn { display: inline-flex; align-items: center; }
      .bubble { max-width: 94%; font-size: 0.92rem; }
      .composer { grid-template-columns: 1fr; }
      .composer .btn { width: 100%; }
      .chat-actions { width: 100%; }
      .chat-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-box">
      <p class="brand">AWG Support</p>
      <h1>Operator desk</h1>
      <p class="hint">Очередь лидов и ответы в Telegram — без лишнего шума.</p>
      <form id="loginForm">
        <input type="text" name="username" autocomplete="username" value="operator" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div style="margin-top:14px">
          <button class="btn block" type="submit">Войти</button>
        </div>
        <div class="err" id="loginErr"></div>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside>
      <div class="bar">
        <h2><span id="listTitle">Чаты</span> <span class="count" id="qCount"></span></h2>
        <button type="button" class="btn ghost" id="logoutBtn">Выйти</button>
      </div>
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-tab="inbox">Все</button>
        <button type="button" class="tab" data-tab="queue">Очередь</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="searchQ" placeholder="Поиск: @user, id, имя" enterkeyhint="search" />
      </div>
      <div class="list" id="queueList"></div>
    </aside>

    <main>
      <div id="emptyState" class="empty-state">
        <strong>Нет открытого чата</strong>
        Выбери диалог слева — сообщения подтянутся без дублей.
      </div>
      <div id="chatPane" class="hidden">
        <div class="chat-head">
          <div class="top-row">
            <button type="button" class="btn ghost back-btn" id="backBtn" aria-label="Назад">←</button>
            <div class="head-avatar" id="chatAvatar" aria-hidden="true">?</div>
            <div class="title" id="chatTitle">—</div>
          </div>
          <div class="chat-actions">
            <button type="button" class="btn ghost" id="takeBtn">Взять</button>
            <button type="button" class="btn ghost" id="releaseBtn">Вернуть боту</button>
          </div>
          <div class="chat-sub" id="chatSub"></div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <div class="fmt-bar" id="fmtBar" title="Выдели текст и нажми кнопку">
            <button type="button" data-fmt="b" title="Жирный (Ctrl+B)"><b>B</b></button>
            <button type="button" data-fmt="i" title="Курсив (Ctrl+I)"><i>I</i></button>
            <button type="button" data-fmt="u" title="Подчёркнутый (Ctrl+U)"><u>U</u></button>
            <button type="button" data-fmt="s" title="Зачёркнутый"><s>S</s></button>
            <button type="button" data-fmt="code" title="Код" style="font-family:var(--mono)">&lt;/&gt;</button>
            <button type="button" data-fmt="link" title="Ссылка">URL</button>
          </div>
          <textarea id="replyText" placeholder="Ответ лиду" rows="2"></textarea>
          <button type="button" class="btn" id="sendBtn">Отправить</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const state = {
      token: localStorage.getItem("op_token") || "",
      leads: [],
      activeId: null,
      lastMsgId: 0,
      seenMsgIds: new Set(),
      loadGen: 0,
      loadInFlight: false,
      loadQueued: false,
      pollTimer: null,
      searchTimer: null,
      tab: localStorage.getItem("op_tab") || "inbox",
    };

    const $ = (id) => document.getElementById(id);

    function isMobile() {
      return window.matchMedia("(max-width: 820px)").matches;
    }

    function setChatOpen(open) {
      $("app").classList.toggle("chat-open", !!open);
    }

    function tgWebApp() {
      try { return window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null; }
      catch (_) { return null; }
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (state.token) headers.Authorization = "Bearer " + state.token;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        const detail = typeof data.detail === "string" ? data.detail : "";
        const isLogin = String(path || "").indexOf("/api/login") === 0;
        if (!isLogin) logout(true);
        throw new Error(detail || "Сессия истекла");
      }
      if (!res.ok) {
        const detail = data.detail;
        const msg = typeof detail === "string" ? detail : (data.message || ("HTTP " + res.status));
        throw new Error(msg);
      }
      return data;
    }

    function showApp(ok) {
      $("login").classList.toggle("hidden", ok);
      $("app").classList.toggle("hidden", !ok);
      if (!ok) setChatOpen(false);
    }

    function logout(silent) {
      const t = state.token;
      state.token = "";
      localStorage.removeItem("op_token");
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = null;
      showApp(false);
      if (!silent && t) api("/api/logout", { method: "POST" }).catch(() => {});
    }

    function reasonLabel(r) {
      return ({
        ask_human: "просил оператора",
        tech_stuck: "техтупик",
        complaint: "жалоба",
        false_claim: "фейк готово",
        stuck_loop: "зациклился",
        manual: "вручную",
      })[r] || (r || "—");
    }

    function setTab(tab) {
      state.tab = tab === "queue" ? "queue" : "inbox";
      localStorage.setItem("op_tab", state.tab);
      document.querySelectorAll("#tabs .tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
      $("listTitle").textContent = state.tab === "queue" ? "Очередь" : "Чаты";
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function initialsOf(lead) {
      const name = String((lead && lead.first_name) || "Л").trim();
      const parts = name.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (parts[0] || "Л").slice(0, 2).toUpperCase();
    }

    function avatarGradient(seed) {
      const s = String(seed || "x");
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      const hues = [152, 164, 178, 140, 188];
      const a = hues[h % hues.length];
      const b = hues[(h >> 3) % hues.length];
      return `linear-gradient(145deg, hsl(${a} 28% 32%), hsl(${b} 34% 22%))`;
    }

    function avatarUrl(leadId) {
      return "/api/leads/" + leadId + "/avatar?t=" + encodeURIComponent(state.token || "");
    }

    function fillAvatar(el, lead) {
      if (!el || !lead) return;
      const initials = initialsOf(lead);
      el.style.background = avatarGradient(lead.telegram_id || lead.id || initials);
      el.textContent = initials;
      el.querySelectorAll("img").forEach((n) => n.remove());
      if (!lead.id || !state.token) return;
      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.src = avatarUrl(lead.id);
      img.onload = () => { el.textContent = ""; el.appendChild(img); };
      img.onerror = () => { img.remove(); };
    }

    function formatTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function sanitizeTgHtml(raw) {
      const input = String(raw || "");
      if (!/<\/?(?:b|strong|i|em|u|ins|s|strike|del|code|pre|a)\b/i.test(input)) {
        return escapeHtml(input)
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/\*([^*\n]+)\*/g, "<i>$1</i>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      const allowed = new Set(["B", "STRONG", "I", "EM", "U", "INS", "S", "STRIKE", "DEL", "CODE", "PRE", "A", "BR"]);
      const doc = new DOMParser().parseFromString("<div>" + input + "</div>", "text/html");
      const root = doc.body.firstElementChild || doc.body;
      const walk = (el) => {
        [...el.children].forEach((child) => {
          const tag = child.tagName;
          if (!allowed.has(tag)) {
            const frag = document.createDocumentFragment();
            while (child.firstChild) frag.appendChild(child.firstChild);
            child.replaceWith(frag);
            return;
          }
          [...child.attributes].forEach((attr) => {
            if (tag === "A" && attr.name.toLowerCase() === "href") {
              const href = String(attr.value || "");
              if (!/^(https?:|tg:)/i.test(href)) child.removeAttribute(attr.name);
            } else {
              child.removeAttribute(attr.name);
            }
          });
          walk(child);
        });
      };
      walk(root);
      return root.innerHTML;
    }

    function wrapSelection(before, after, placeholder) {
      const ta = $("replyText");
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const val = ta.value;
      const selected = val.slice(start, end);
      const body = selected || (placeholder || "text");
      const next = val.slice(0, start) + before + body + after + val.slice(end);
      ta.value = next;
      ta.focus();
      const innerStart = start + before.length;
      ta.setSelectionRange(innerStart, innerStart + body.length);
      autosize();
    }

    function applyFormat(kind) {
      if (kind === "b") return wrapSelection("<b>", "</b>", "жирный");
      if (kind === "i") return wrapSelection("<i>", "</i>", "курсив");
      if (kind === "u") return wrapSelection("<u>", "</u>", "текст");
      if (kind === "s") return wrapSelection("<s>", "</s>", "текст");
      if (kind === "code") return wrapSelection("<code>", "</code>", "code");
      if (kind === "link") {
        const url = prompt("Ссылка (https://…)", "https://");
        if (!url) return;
        const safe = String(url).trim();
        if (!/^(https?:|tg:)/i.test(safe)) {
          alert("Нужна ссылка http(s) или tg://");
          return;
        }
        return wrapSelection('<a href="' + safe.replace(/"/g, "") + '">', "</a>", "ссылка");
      }
    }

    function startPolling() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        try {
          await refreshQueue();
          await loadMessages(false);
        } catch (_) {}
      }, 2500);
    }

    function renderQueue(items) {
      state.leads = items || [];
      $("qCount").textContent = items.length ? String(items.length) : "";
      const box = $("queueList");
      if (!items.length) {
        box.innerHTML = '<div class="list-empty">' + (state.tab === "queue" ? "Очередь пуста" : "Пока нет диалогов") + "</div>";
        return;
      }
      box.innerHTML = items.map((l) => {
        const name = (l.first_name || "Лид") + (l.username ? " @" + l.username : "");
        const st = l.human_status === "taken" ? "taken" : "queued";
        const active = l.id === state.activeId ? " active" : "";
        const inHandoff = l.human_status === "queued" || l.human_status === "taken";
        const statusTxt = inHandoff ? st : (l.stage_label || "bot");
        const statusCls = inHandoff ? ("is-" + st) : "";
        const metaBits = [
          l.stage_label || null,
          inHandoff ? reasonLabel(l.handoff_reason) : null,
        ].filter(Boolean);
        const preview = String(l.last_user_text || "").replace(/<[^>]+>/g, "");
        return `<button type="button" class="item${active}" data-id="${l.id}">
          <div class="avatar" data-av="${l.id}">${escapeHtml(initialsOf(l))}</div>
          <div class="row">
            <span class="name">${escapeHtml(name)}</span>
            <span class="status ${statusCls}">${escapeHtml(statusTxt)}</span>
          </div>
          <div class="meta">${escapeHtml(metaBits.join(" · ") || "—")}</div>
          <div class="preview">${escapeHtml(preview)}</div>
        </button>`;
      }).join("");
      box.querySelectorAll(".item").forEach((el) => {
        el.onclick = () => openLead(Number(el.dataset.id));
      });
      items.forEach((l) => {
        const av = box.querySelector('.avatar[data-av="' + l.id + '"]');
        if (av) {
          av.style.background = avatarGradient(l.telegram_id || l.id);
          fillAvatar(av, l);
        }
      });
    }

    async function refreshQueue() {
      const path = state.tab === "queue" ? "/api/queue" : "/api/inbox";
      const data = await api(path);
      renderQueue(data.items || []);
    }

    function resetMessageState() {
      state.loadGen += 1;
      state.lastMsgId = 0;
      state.seenMsgIds = new Set();
      state.loadQueued = false;
      $("msgs").innerHTML = "";
    }

    function closeChat() {
      state.activeId = null;
      resetMessageState();
      $("chatPane").classList.add("hidden");
      $("emptyState").classList.remove("hidden");
      setChatOpen(false);
      renderQueue(state.leads);
    }

    function updateActionButtons(lead) {
      const hs = String((lead && lead.human_status) || "bot").toLowerCase();
      const taken = hs === "taken";
      $("takeBtn").classList.toggle("hidden", taken);
      $("releaseBtn").classList.toggle("hidden", !taken);
    }

    async function openLead(id) {
      state.activeId = id;
      resetMessageState();
      const gen = state.loadGen;
      $("emptyState").classList.add("hidden");
      $("chatPane").classList.remove("hidden");
      setChatOpen(true);
      renderQueue(state.leads);

      const lead = await api("/api/leads/" + id);
      if (gen !== state.loadGen || state.activeId !== id) return;
      const name = (lead.first_name || "Лид") + (lead.username ? " @" + lead.username : "");
      $("chatTitle").textContent = name;
      fillAvatar($("chatAvatar"), lead);
      updateActionButtons(lead);
      const chips = [];
      if (lead.telegram_id != null) {
        chips.push(`<span class="chip"><span class="k">tg</span>${escapeHtml(String(lead.telegram_id))}</span>`);
      }
      if (lead.stage_label) {
        chips.push(`<span class="chip stage">${escapeHtml(String(lead.stage_label))}</span>`);
      }
      const hs = String(lead.human_status || "bot").toLowerCase();
      const hsCls = hs === "taken" ? "status-taken" : (hs === "queued" ? "status-queued" : "status-bot");
      chips.push(`<span class="chip ${hsCls}">${escapeHtml(hs)}</span>`);
      if (lead.bot_muted) {
        chips.push(`<span class="chip mute">mute</span>`);
      }
      const reason = reasonLabel(lead.handoff_reason);
      if (reason && reason !== "—") {
        chips.push(`<span class="chip">${escapeHtml(reason)}</span>`);
      }
      $("chatSub").innerHTML = chips.join("");
      await loadMessages(true);
    }

    function appendMessage(m) {
      if (!m || m.id == null) return false;
      if (state.seenMsgIds.has(m.id)) return false;
      state.seenMsgIds.add(m.id);
      state.lastMsgId = Math.max(state.lastMsgId, m.id);

      const src = (m.meta && m.meta.source) || "";
      let cls = m.role === "user" ? "user" : (src === "operator" ? "operator" : "assistant");
      let who = m.role === "user" ? "лид" : (src === "operator" ? "оператор" : (src === "handoff" ? "система" : "бот"));
      if (m.role === "user" && src === "command") {
        cls += " cmd";
        who = "команда";
      } else if (m.role === "user" && src === "button") {
        cls += " btn-tap";
        who = "кнопка";
      } else if (m.role === "user" && /^\/\w/.test(String(m.content || "").trim())) {
        cls += " cmd";
        who = "команда";
      }
      const el = document.createElement("div");
      el.className = "bubble " + cls;
      el.dataset.msgId = String(m.id);
      el.innerHTML =
        `<div class="who"><span>${who}</span><span class="when">${escapeHtml(formatTime(m.created_at))}</span></div>` +
        `<div class="bubble-body">${sanitizeTgHtml(m.content)}</div>`;
      $("msgs").appendChild(el);
      return true;
    }

    async function loadMessages(scrollEnd) {
      if (!state.activeId) return;
      if (state.loadInFlight) {
        state.loadQueued = true;
        return;
      }
      state.loadInFlight = true;
      const gen = state.loadGen;
      const leadId = state.activeId;
      const after = state.lastMsgId;
      try {
        const data = await api(`/api/leads/${leadId}/messages?after_id=${after}`);
        if (gen !== state.loadGen || state.activeId !== leadId) return;
        const box = $("msgs");
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
        let added = 0;
        (data.messages || []).forEach((m) => {
          if (appendMessage(m)) added += 1;
        });
        if (added && (scrollEnd || nearBottom)) box.scrollTop = box.scrollHeight;
      } finally {
        state.loadInFlight = false;
        if (state.loadQueued && state.activeId === leadId && gen === state.loadGen) {
          state.loadQueued = false;
          await loadMessages(scrollEnd);
        } else {
          state.loadQueued = false;
        }
      }
    }

    async function sendReply() {
      const text = $("replyText").value.trim();
      if (!text || !state.activeId) return;
      $("sendBtn").disabled = true;
      try {
        await api(`/api/leads/${state.activeId}/reply`, {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        $("replyText").value = "";
        autosize();
        await loadMessages(true);
        await refreshQueue();
      } catch (e) {
        alert(e.message || e);
      } finally {
        $("sendBtn").disabled = false;
      }
    }

    function autosize() {
      const ta = $("replyText");
      ta.style.height = "auto";
      ta.style.height = Math.min(160, Math.max(52, ta.scrollHeight)) + "px";
    }

    $("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      $("loginErr").textContent = "";
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ password: $("password").value }),
        });
        state.token = data.token;
        localStorage.setItem("op_token", state.token);
        showApp(true);
        setTab(state.tab);
        await refreshQueue();
        startPolling();
      } catch (err) {
        $("loginErr").textContent = err.message || "Ошибка входа";
      }
    };

    document.querySelectorAll("#tabs .tab").forEach((btn) => {
      btn.onclick = async () => {
        setTab(btn.dataset.tab);
        $("searchQ").value = "";
        await refreshQueue();
      };
    });

    $("logoutBtn").onclick = () => logout(false);
    $("backBtn").onclick = () => closeChat();
    $("sendBtn").onclick = sendReply;
    $("fmtBar").querySelectorAll("button[data-fmt]").forEach((btn) => {
      btn.onclick = () => applyFormat(btn.dataset.fmt);
    });
    $("replyText").addEventListener("input", autosize);
    $("replyText").addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey) {
        const k = e.key.toLowerCase();
        if (k === "b") { e.preventDefault(); applyFormat("b"); return; }
        if (k === "i") { e.preventDefault(); applyFormat("i"); return; }
        if (k === "u") { e.preventDefault(); applyFormat("u"); return; }
      }
      if (e.key === "Enter" && !e.shiftKey && !isMobile()) {
        e.preventDefault();
        sendReply();
      }
    });
    $("takeBtn").onclick = async () => {
      if (!state.activeId) return;
      await api(`/api/leads/${state.activeId}/take`, { method: "POST" });
      await openLead(state.activeId);
      await refreshQueue();
    };
    $("releaseBtn").onclick = async () => {
      if (!state.activeId) return;
      await api(`/api/leads/${state.activeId}/release`, { method: "POST" });
      closeChat();
      await refreshQueue();
    };
    $("searchQ").oninput = () => {
      clearTimeout(state.searchTimer);
      state.searchTimer = setTimeout(async () => {
        const q = $("searchQ").value.trim();
        if (q.length < 2) {
          await refreshQueue();
          return;
        }
        const data = await api("/api/search?q=" + encodeURIComponent(q));
        renderQueue(data.items || []);
      }, 250);
    };

    window.addEventListener("resize", () => {
      if (!isMobile()) setChatOpen(!!state.activeId);
    });

    async function enterApp() {
      showApp(true);
      setTab(state.tab);
      await refreshQueue();
      startPolling();
    }

    async function loginWithTelegramPayload(payload) {
      state.token = "";
      localStorage.removeItem("op_token");
      const data = await api("/api/login/telegram", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      state.token = data.token;
      localStorage.setItem("op_token", state.token);
      await enterApp();
      return true;
    }

    async function tryAuthFromTelegram() {
      const tw = tgWebApp();
      if (tw) {
        try {
          tw.ready();
          tw.expand();
        } catch (_) {}
      }
      const initData = tw && tw.initData ? String(tw.initData) : "";
      if (initData) {
        try {
          return await loginWithTelegramPayload({ init_data: initData });
        } catch (err) {
          $("loginErr").textContent = err.message || "WebApp вход не удался";
        }
      }
      const params = new URLSearchParams(window.location.search || "");
      const auth = params.get("auth");
      if (!auth) return false;
      try {
        const ok = await loginWithTelegramPayload({ auth });
        const clean = window.location.pathname + (window.location.hash || "");
        window.history.replaceState({}, "", clean);
        return ok;
      } catch (err) {
        $("loginErr").textContent = err.message || "Ссылка недействительна";
        return false;
      }
    }

    (async () => {
      if (await tryAuthFromTelegram()) return;
      if (!state.token) return;
      try {
        await api(state.tab === "queue" ? "/api/queue" : "/api/inbox");
        await enterApp();
      } catch (_) {
        logout(true);
      }
    })();
  </script>
</body>
</html>
